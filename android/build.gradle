// build.gradle (project-level)
plugins {
    id("com.android.application") version "8.6.0" apply false // Example version
    id("com.google.gms.google-services") version "4.4.3" apply false // Ensure correct version and apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

